<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light only">
  <meta name="supported-color-schemes" content="light">
  <title>Connexion — Kontra-Africa</title>
  <meta name="description" content="Connectez-vous à Kontra-Africa avec votre compte Google.">
  <meta name="theme-color" content="#5B3FE0">

  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="manifest" href="/manifest.json">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/login.css">
</head>
<body>

  <main class="login-page">
    <div class="login-card">

      <a href="/" class="login-card__logo-link" aria-label="Retour à l'accueil">
        <img src="/logo.webp" alt="Kontra-Africa" class="login-card__logo">
      </a>

      <div class="login-card__intro">
        <h1 class="login-card__title">Bienvenue sur Kontra-Africa</h1>
        <p class="login-card__subtitle">Connectez-vous pour créer vos contrats et suivre vos finances.</p>
      </div>

      <!-- Zone d'état : bouton par défaut, chargement, ou erreur -->
      <div class="login-card__zone">

        <button type="button" id="googleBtn" class="google-btn">
          <svg class="google-btn__icon" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.4 5.3 29.5 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.4-.1-2.8-.4-3.5z"/>
            <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.6 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.4 5.3 29.5 3 24 3 16 3 9 7.4 6.3 14.7z"/>
            <path fill="#4CAF50" d="M24 45c5.4 0 10.3-2.1 14-5.5l-6.5-5.4c-2 1.4-4.6 2.4-7.5 2.4-5.2 0-9.6-3.3-11.3-8l-6.6 5.1C9 40.6 16 45 24 45z"/>
            <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.6l6.5 5.4C41.4 35.9 45 30.5 45 24c0-1.4-.1-2.8-.4-3.5z"/>
          </svg>
          <span>Continuer avec Google</span>
        </button>

        <div class="login-state login-state--loading" id="loadingState" hidden>
          <span class="spinner" aria-hidden="true"></span>
          <p id="loadingLabel">Connexion en cours…</p>
        </div>

        <div class="login-state login-state--error" id="errorState" role="alert" hidden>
          <p id="errorMessage">Une erreur est survenue.</p>
          <button type="button" id="retryBtn" class="btn btn-secondary">Réessayer</button>
        </div>

      </div>

      <p class="login-card__trial">Essai gratuit de 3 jours, sans carte bancaire requise</p>

    </div>
  </main>

  <script type="module" src="/js/login.js"></script>
</body>
</html>
