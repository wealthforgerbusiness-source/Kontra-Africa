<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light only">
  <meta name="supported-color-schemes" content="light">
  <title>Tableau de bord — Kontra-Africa</title>
  <meta name="theme-color" content="#5B3FE0">

  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="manifest" href="/manifest.json">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>

  <!-- Écran de chargement affiché pendant la vérification auth + abonnement -->
  <div class="app-loading" id="appLoading">
    <span class="spinner" aria-hidden="true"></span>
  </div>

  <div class="app-shell" id="appShell" hidden>

    <!-- ============================= SIDEBAR (desktop) ============================= -->
    <!-- ⚠️ CORRECTIF : cette page utilisait une sidebar codée en dur, écrite
         avant l'ajout de la page "Stock" et jamais mise à jour depuis — d'où
         le lien manquant. Comme toutes les autres pages (Finances, Contrats,
         Stock, Profil), on utilise maintenant un conteneur vide avec
         id="app-sidebar", rempli dynamiquement par renderAppNav() (voir
         js/app-nav.js) à partir de la liste NAV_ITEMS à jour. -->
    <nav id="app-sidebar" class="app-sidebar" aria-label="Navigation principale"></nav>

    <!-- ============================= TOPBAR (mobile) ============================= -->
    <header class="app-topbar">
      <div class="app-topbar__brand">
        <img src="/logo.webp" alt="Kontra-Africa" class="app-topbar__logo">
        <span class="app-topbar__brand-text">Kontra-Africa</span>
      </div>
      <img src="" alt="" class="app-topbar__avatar" id="topbarAvatar" hidden>
    </header>

    <!-- ============================= CONTENU ============================= -->
    <main class="app-main" id="appMain">
      <div class="app-page-header">
        <h1 id="dashboardGreeting">Bonjour</h1>
        <p class="app-page-header__subtitle">Voici un aperçu de votre activité.</p>
      </div>

      <div class="dashboard-grid">

        <!-- Solde actuel -->
        <section class="dashboard-card dashboard-card--balance">
          <div class="dashboard-card__label-row">
            <p class="dashboard-card__label">Solde actuel</p>
            <button type="button" class="dashboard-card__convert" id="btnConvertBalance" title="Convertir l'affichage">
              ⇄ <span id="btnConvertBalanceLabel">Voir en $</span>
            </button>
          </div>
          <p class="dashboard-card__value" id="balanceValue">—</p>
        </section>

        <!-- Objectif d'épargne -->
        <section class="dashboard-card dashboard-card--savings">
          <div class="dashboard-card__label-row">
            <p class="dashboard-card__label">Objectif d'épargne</p>
            <button type="button" class="dashboard-card__convert" id="btnConvertSavings" title="Convertir l'affichage">
              ⇄ <span id="btnConvertSavingsLabel">Voir en $</span>
            </button>
          </div>
          <p class="dashboard-card__amounts" id="savingsAmounts">—</p>
          <div class="savings-progress">
            <div class="savings-progress__fill" id="savingsProgressFill" style="width: 0%;"></div>
          </div>
          <p class="dashboard-card__hint" id="savingsHint">Chargement…</p>
        </section>

        <!-- Contrats -->
        <section class="dashboard-card dashboard-card--contracts">
          <p class="dashboard-card__label">Contrats</p>
          <div class="dashboard-card__stats">
            <div class="dashboard-stat">
              <span class="dashboard-stat__value" id="pendingContractsValue">—</span>
              <span class="dashboard-stat__label">En attente</span>
            </div>
            <div class="dashboard-stat">
              <span class="dashboard-stat__value" id="signedContractsValue">—</span>
              <span class="dashboard-stat__label">Signés</span>
            </div>
          </div>
        </section>

        <!-- Activité des 7 derniers jours -->
        <section class="dashboard-card dashboard-card--activity">
          <p class="dashboard-card__label">Activité des 7 derniers jours</p>
          <div class="balance-activity-chart" id="balanceActivityChart"></div>
          <div class="balance-activity-list" id="balanceActivityList"></div>
          <p class="dashboard-chart-empty" id="activityEmptyState" hidden>Pas encore de mouvement sur votre solde.</p>
        </section>

      </div>
    </main>

    <!-- ============================= BOTTOM NAV (mobile) ============================= -->
    <!-- ⚠️ CORRECTIF : supprimé, codé en dur ici aussi (sans Stock).
         renderAppNav() crée maintenant ce bloc dynamiquement (voir
         renderBottomNav() dans js/app-nav.js) et l'ajoute à la fin de
         <body>, avec la liste à jour, exactement comme sur les autres
         pages. Ne pas remettre de <nav class="app-bottomnav"> statique ici,
         sinon renderAppNav() le détecte déjà présent et ne le remplace pas. -->

  </div>

  <script type="module" src="/js/dashboard.js"></script>
</body>
</html>
