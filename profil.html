<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light only">
  <meta name="supported-color-schemes" content="light">
  <title>Profil — Kontra-Africa</title>
  <link rel="icon" href="/public/icons/icon-192.png" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/css/profil.css" />
</head>
<body>
  <div id="app-shell" class="app-shell">
    <nav id="app-sidebar" class="app-sidebar" aria-label="Navigation principale"></nav>

    <main class="app-main" id="main-content">
      <header class="page-header">
        <div>
          <h1 class="page-title">Profil</h1>
          <p class="page-subtitle">Vos informations et votre abonnement</p>
        </div>
      </header>

      <!-- Carte identité -->
      <section class="profile-card">
        <img id="profile-photo" class="profile-photo" src="/public/icons/icon-192.png" alt="" />
        <div class="profile-identity">
          <p id="profile-name" class="profile-name">—</p>
          <p id="profile-email" class="profile-email">—</p>
        </div>
      </section>

      <!-- Statut abonnement -->
      <section class="panel">
        <h2 class="panel-title">Abonnement</h2>
        <div id="subscription-status" class="subscription-status">
          <!-- Affiché juste après un retour de paiement SasPay
               (?payment=success), tant que le webhook n'a pas encore
               confirmé l'activation côté serveur. Purement informatif :
               ce n'est jamais ce paramètre d'URL qui débloque l'accès. -->
          <div id="payment-pending-banner" class="payment-pending-banner" hidden>
            <span class="spinner" aria-hidden="true"></span>
            <span id="payment-pending-text">Paiement reçu, activation de ton abonnement en cours…</span>
          </div>

          <p id="subscription-message" class="subscription-message">Chargement…</p>

          <!-- ===================================================
               CHOIX DE LA DEVISE DE PAIEMENT
               Bascule l'affichage du prix ET la devise réellement
               envoyée à /api/checkout (voir js/profil.js).
          ==================================================== -->
          <div id="resubscribe-currency-toggle" class="paywall__currency-toggle" role="group" aria-label="Devise de paiement" hidden>
            <button type="button" id="resubscribeCurrencyUsd" class="paywall__currency-btn is-active" data-currency="USD">$ USD</button>
            <button type="button" id="resubscribeCurrencyCdf" class="paywall__currency-btn" data-currency="CDF">FC CDF</button>
          </div>

          <div id="resubscribe-price" class="paywall__price" hidden>
            <span class="paywall__currency" id="resubscribePriceSymbol">$</span>
            <span id="resubscribePriceAmount">5</span>
            <span class="paywall__period">/mois</span>
          </div>

          <div id="resubscribe-phone-row" class="resubscribe-phone-row" hidden>
            <label for="resubscribe-phone" class="resubscribe-phone-label">Numéro Mobile Money (pour le paiement)</label>
            <div class="resubscribe-phone-inputs">
              <select id="resubscribe-country" class="resubscribe-phone-select"></select>
              <input type="tel" id="resubscribe-phone" class="resubscribe-phone-input" placeholder="8123456789" inputmode="numeric" autocomplete="tel">
            </div>
          </div>

          <button type="button" id="btn-resubscribe" class="btn btn-primary" hidden>
            Se réabonner
          </button>

          <div id="payment-reference-row" class="resubscribe-phone-row" hidden>
            <label class="resubscribe-phone-label">Paiement déjà effectué mais pas encore confirmé ?</label>
            <button type="button" id="btn-verify-payment" class="btn btn-secondary">Vérifier mon paiement</button>
          </div>

          <p id="subscription-error" class="form-error" role="alert" hidden></p>
        </div>
      </section>

      <!-- Réglages -->
      <section class="panel">
        <h2 class="panel-title">Réglages</h2>
        <a href="/finances.html" class="settings-link">
          Modifier la devise et le taux de change
        </a>
      </section>

      <!-- Déconnexion -->
      <section class="panel">
        <button type="button" id="btn-logout" class="btn btn-logout btn-block">
          Se déconnecter
        </button>
      </section>
    </main>
  </div>

  <script type="module" src="/js/firebase-config.js"></script>
  <script type="module" src="/js/auth-guard.js"></script>
  <script type="module" src="/js/profil.js"></script>
  <script src="/js/sw-register.js"></script>
</body>
</html>
